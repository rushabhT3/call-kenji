name: Deploy

# Manual only: deploying costs money and is public, so a person starts it.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: us-west1
  SERVICE: call-kenji

jobs:
  voice-server:
    name: Voice server to Cloud Run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Write non-secret settings from repository variables
        run: |
          cat > cloud-run.env.yaml <<EOF
          LLM_BASE_URL: "${{ vars.LLM_BASE_URL }}"
          LLM_REASONING_EFFORT: "${{ vars.LLM_REASONING_EFFORT }}"
          TALKER_MODEL: "${{ vars.TALKER_MODEL }}"
          STRATEGIST_MODEL: "${{ vars.STRATEGIST_MODEL }}"
          TRANSLATOR_MODEL: "${{ vars.TRANSLATOR_MODEL }}"
          TWILIO_ACCOUNT_SID: "${{ vars.TWILIO_ACCOUNT_SID }}"
          PUBLIC_BASE_URL: "${{ vars.PUBLIC_BASE_URL }}"
          CLOUDFLARE_TURN_KEY_ID: "${{ vars.CLOUDFLARE_TURN_KEY_ID }}"
          EOF
      - name: Build and deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --cpu 1 --memory 1Gi \
            --min-instances 1 --max-instances 1 \
            --timeout 3600 \
            --set-secrets "LLM_API_KEY=llm-api-key:latest,SONIOX_API_KEY=soniox-api-key:latest,CARTESIA_API_KEY=cartesia-api-key:latest,TWILIO_AUTH_TOKEN=twilio-auth-token:latest,CLOUDFLARE_TURN_API_TOKEN=cloudflare-turn-api-token:latest,PROXY_SHARED_SECRET=proxy-shared-secret:latest" \
            --env-vars-file deploy/cloud-run.env.yaml \
            --add-volume name=data,type=cloud-storage,bucket="${{ secrets.DATA_BUCKET }}" \
            --add-volume-mount volume=data,mount-path=/data \
            --allow-unauthenticated

  web:
    name: Web page to Cloudflare Workers
    runs-on: ubuntu-24.04
    needs: voice-server
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_PHONE_NUMBER: ${{ vars.PHONE_NUMBER }}
      - run: npx --yes wrangler@4.147.0 deploy --var "VOICE_SERVER_URL:${{ vars.VOICE_SERVER_URL }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
