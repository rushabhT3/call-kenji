# The fictional debtors a caller can play. No real person or account.
# Each persona's lines are offered on the page at the steps listed, and can be spoken for the
# caller. Amounts follow the terms: at least ¥5,000 a month and at most 6 payments.
default: sato
personas:
  - id: sato
    debtor:
      family_name_kana: さとう
      given_name_kana: ゆうき
      written_name: 佐藤ゆうき
      family_name_written: 佐藤
      family_name_latin: Sato
      date_of_birth: 1990-07-14
    name_en: Yuki Sato
    birth_date_ja: 平成2年7月14日
    account_suffix: "7731"
    balance_yen: 35000
    overdue_since: 2026-09-30
    situation:
      en: Your hours were cut this month. You want to pay, but only a little at a time.
      ja: 今月は勤務時間が減りました。払う気はありますが、少しずつしか払えません。
    mood:
      en: Cooperative, a little embarrassed.
      ja: 協力的で、少し気まずそう。
    phrases:
      - id: identity
        steps: [greeting, verify_identity]
        label: Say who I am
        ja: 佐藤ゆうきです。生年月日は、平成2年7月14日です。
        en: I'm Yuki Sato. My date of birth is July 14, 1990.
      - id: wrong_birthday
        steps: [greeting, verify_identity]
        label: Give a wrong birthday
        ja: 佐藤ゆうきです。生年月日は、平成2年7月24日です。
        en: I'm Yuki Sato. My date of birth is July 24, 1990.
      - id: family
        steps: [greeting, verify_identity]
        label: Answer as a family member
        ja: 佐藤の家族です。本人はいま出かけています。
        en: I'm a family member. Yuki is out right now.
      - id: story
        steps: [state_balance, listen]
        label: Explain my situation
        ja: 今月は勤務時間が減ってしまって、少し厳しいんです。
        en: My hours were cut this month, so things are a bit tight.
      - id: too_little
        steps: [state_balance, listen, negotiate]
        label: Offer ¥3,000 a month
        ja: 月3,000円なら払えます。
        en: I can pay 3,000 yen a month.
      - id: accept
        steps: [negotiate]
        label: Agree to ¥6,000 a month
        ja: わかりました。では、月6,000円でお願いします。
        en: All right. 6,000 yen a month, then.
      - id: ask_person
        steps: [state_balance, listen, negotiate]
        label: Ask for a person
        ja: 担当者の方と直接お話ししたいです。
        en: I'd like to speak with a person directly.
      - id: stop_calling
        steps: [state_balance, listen, negotiate]
        label: Ask him to stop calling
        ja: もう電話してこないでください。
        en: Please don't call me again.
      - id: confirm
        steps: [negotiate, read_back]
        label: Confirm the plan
        ja: はい、間違いありません。
        en: Yes, that's right.

