[project]
name = "call-kenji"
version = "0.1.0"
description = "A Japanese debt-collection voice agent demo with a live view of its reasoning."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pipecat-ai[soniox,cartesia,openai,webrtc,websocket,runner,tracing]==1.12.0",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "openai==3.23.0",
    "onnxruntime==1.24.4",
    "numpy==2.5.3",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "twilio==9.11.2",
]

[project.scripts]
kenji-server = "kenji.server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
    "onnx==1.23.1",
]

[build-system]
requires = ["uv_build==0.12.22"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.22"

[tool.uv.build-backend]
module-name = "kenji"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "UP", "SIM", "RUF", "C90", "PL", "PT", "RET", "ARG", "ERA", "T20",
    "ASYNC", "S", "DTZ", "PTH", "TID",
]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["-m", "not real_llm", "--strict-markers", "--cov=kenji", "--cov-branch", "--cov-report=term-missing:skip-covered"]
markers = ["real_llm: talks to the real LLM API; opt in with -m real_llm"]

[tool.coverage.run]
source = ["src/kenji"]

# These packages ship no type information.
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "pipecat_ai_prebuilt.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
